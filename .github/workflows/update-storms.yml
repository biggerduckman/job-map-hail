name: Refresh storm data (rolling 12 months)
on:
  schedule:
    - cron: "30 11 * * *"   # daily, 6:30 am EST / 7:30 am EDT (after NOAA's overnight EFC refresh)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: .hail_cache
          key: hail-cache-${{ github.run_id }}
          restore-keys: hail-cache-
      - run: pip install shapely
      - run: python update_hail.py
      - name: Commit if changed
        run: |
          git config user.name "storm-data-bot"
          git config user.email "storm-data-bot@users.noreply.github.com"
          git add storms
          git diff --cached --quiet || (git commit -m "Refresh storm data $(date -u +%F)" && git push)
